<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16141f" media="(prefers-color-scheme: dark)">
<title>{% block title %}Фінанси Олі й Марка{% endblock %}</title>
<style>
:root {
  --bg: #f6f5f1; --card: #ffffff; --ink: #1b1a22; --muted: #6a6775; --line: #e4e1da;
  --accent: #3f2f8f; --accent-soft: #e9e6f6; --accent-ink: #ffffff;
  --good: #1e6b46; --warn: #9a4b00; --bad: #a3242c; --bad-soft: #fbe9ea;
  --bar: #3f2f8f; --bar-2: #b9b2dc;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16141f; --card: #201d2c; --ink: #f1eff7; --muted: #a8a3b8; --line: #332f44;
    --accent: #b3a6f5; --accent-soft: #2c2745; --accent-ink: #16141f;
    --good: #7fd3a6; --warn: #f3b26b; --bad: #ff8f97; --bad-soft: #3a2026;
    --bar: #b3a6f5; --bar-2: #4c4472;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-variant-numeric: tabular-nums;
}
a { color: var(--accent); }
.wrap { max-width: 560px; margin: 0 auto; padding: 12px 16px 96px; }
header.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 8px 0 12px;
}
header.top h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: .01em; }
header.top nav { display: flex; align-items: center; gap: 14px; font-size: 14px; }
header.top nav a { text-decoration: none; color: var(--muted); }
header.top nav a[aria-current="page"] { color: var(--ink); font-weight: 600; }
header.top form { margin: 0; }
.linkish { background: none; border: 0; padding: 0; font: inherit; color: var(--muted); cursor: pointer; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; margin: 12px 0;
}
.card h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); margin: 0 0 6px; }
.big { font-size: 30px; font-weight: 650; margin: 0; line-height: 1.15; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
.flash { background: var(--accent-soft); border-radius: var(--radius); padding: 12px 14px; margin: 8px 0; }
.error { background: var(--bad-soft); color: var(--bad); border-radius: var(--radius); padding: 12px 14px; margin: 8px 0; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 48px; padding: 0 20px; border-radius: 999px; border: 0;
  background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600;
  text-decoration: none; cursor: pointer; width: 100%;
}
label { display: block; font-size: 14px; color: var(--muted); margin: 14px 0 6px; }
input, select {
  width: 100%; min-height: 48px; padding: 10px 12px; font: inherit; font-size: 17px;
  color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px;
}
input:focus, select:focus, .btn:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
footer.foot { color: var(--muted); font-size: 12px; text-align: center; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  {% if user %}
  <header class="top">
    <h1>Наш бюджет</h1>
    <nav>
      <a href="{{ url_for('report') }}" {% if request.endpoint == 'report' %}aria-current="page"{% endif %}>Звіт</a>
      <a href="{{ url_for('add') }}" {% if request.endpoint == 'add' %}aria-current="page"{% endif %}>Готівка</a>
      <a href="/fava/">Детально</a>
      <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <button class="linkish" type="submit">Вийти</button>
      </form>
    </nav>
  </header>
  {% endif %}
  {% for msg in get_flashed_messages() %}<div class="flash" role="status">{{ msg }}</div>{% endfor %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
